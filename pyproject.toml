[project]
name = "querya"
version = "0.1.0"
description = "Ask business questions in plain English and get answers from a SQL database, with guarded SQL, traces and evals."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Sampath Bandla" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.0",
    "fastapi>=0.135",
    "langgraph>=1.0",
    "openai>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "sqlglot>=30.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
langfuse = ["langfuse>=3.0"]

[project.scripts]
querya = "querya.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querya"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "RET"]
ignore = ["RUF012", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:langgraph.*"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
